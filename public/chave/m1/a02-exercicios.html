, "src": "/audio/chave/75648af6c5a9a25f.mp3"}, {"t": "mc", "p": "Ouça e escolha como se escreve:", "o": ["contraseña", "contrasenha", "contrasella"], "c": 0, "e": "Contraseña, com Ñ: é a senha.", "src": "/audio/chave/4e4cf570604f1e05.mp3"}, {"t": "mc", "p": "Em «Me llamo Ana», o LL soa:", "o": ["parecido com um «j» bem suave", "como o LH de «olho»", "como um L comum"], "c": 0, "e": "LL e Y soam quase iguais e variam por país. Na Argentina, por exemplo, viram um som de «ch» suave."}, {"t": "mc", "p": "Ouça e escolha o que você ouviu:", "o": ["Buenos días, equipo.", "Buenas días, equipo.", "Bueno día, equipo."], "c": 0, "e": "Buenos días: masculino e plural. Vamos ver isso na próxima aula.", "src": "/audio/chave/51e047ed2469fe1e.mp3"}, {"t": "mc", "p": "Ouça a frase de uma apresentação. Qual palavra termina com som de O, e não de U?", "o": ["todas: Pablo, mucho e proyecto", "nenhuma", "só Pablo"], "c": 0, "e": "O O final do espanhol continua O. «Pablu», «muchu» denunciam o sotaque brasileiro.", "src": "/audio/chave/22b4f30d30b6b4cf.mp3"}]}]}</script><script src="/chave/assets/chave.js?v=1"></script></body></html>
