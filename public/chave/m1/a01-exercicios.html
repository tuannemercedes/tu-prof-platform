</div><script id="dados" type="application/json">{"secoes": [{"titulo": "Na história", "sub": "A Camila no Casa Común, na Cidade do México.", "itens": [{"t": "mc", "p": "Na ficha do Casa Común, «apellido» significa:", "o": ["sobrenome", "apelido", "nome do meio"], "c": 0, "e": "Apellido é o sobrenome. O nosso apelido é <b>apodo<\/b> ou <b>sobrenombre<\/b>."}, {"t": "mc", "p": "«Su oficina es la número tres.» A Lucía está falando de:", "o": ["um escritório", "uma oficina mecânica", "uma loja"], "c": 0, "e": "Oficina é escritório. Oficina mecânica é <b>taller<\/b>."}, {"t": "mc", "p": "«Espera un rato, por favor.» Ela pede:", "o": ["um momento de espera", "cuidado com um rato", "silêncio"], "c": 0, "e": "Un rato é um momento, um tempinho."}, {"t": "mc", "p": "«La comida está exquisita.» A comida está:", "o": ["deliciosa", "estranha", "fria"], "c": 0, "e": "Exquisito é um elogio: delicioso, refinado."}, {"t": "match", "p": "Ligue cada campo da ficha ao português:", "pares": [["correo electrónico", "e-mail"], ["fecha", "data"], ["ciudad", "cidade"], ["apellido", "sobrenome"]], "e": "Repare: fecha é data, não fechamento.", "tag": "ligue"}, {"t": "mc", "p": "Falar português devagar é suficiente para um hispanofalante entender tudo.", "o": ["Verdadeiro", "Falso"], "c": 1, "e": "Ajuda a entender um pouco, mas os falsos amigos e a pronúncia atrapalham. Por isso o portunhol cansa quem ouve.", "embaralhar": false, "tag": "verdadeiro ou falso"}]}, {"titulo": "No seu trabalho", "sub": "As mesmas estruturas em reuniões, e-mails e calls com equipes e clientes hispânicos.", "itens": [{"t": "mc", "p": "No cadastro de fornecedores de um cliente mexicano aparece o campo «Fecha de alta». «Fecha» é:", "o": ["data", "fechamento", "prazo final"], "c": 0, "e": "Fecha de alta é a data de cadastro. «Dar de alta» é registrar."}, {"t": "mc", "p": "Um colega de Bogotá escreve no chat: «Te envío el informe en un rato». Você recebe o relatório:", "o": ["daqui a pouco", "no fim do mês", "só se você pedir de novo"], "c": 0, "e": "En un rato: daqui a pouco, em alguns minutos."}, {"t": "mc", "p": "No onboarding, o RH da filial pede «nombre y apellidos». Por que «apellidos» no plural?", "o": ["Em muitos países se usam dois sobrenomes, o do pai e o da mãe", "É um erro de digitação", "Eles querem os seus apelidos"], "c": 0, "e": "No México, na Colômbia ou na Espanha, a pessoa costuma ter dois sobrenomes: García López. Em documentos, informe os dois, se tiver."}, {"t": "mc", "p": "Num jantar com clientes, o diretor comenta: «Este vino es exquisito». Ele está:", "o": ["elogiando o vinho", "criticando o vinho", "pedindo outro vinho"], "c": 0, "e": "Exquisito é um elogio. «Esquisito», no sentido do português, seria <b>raro<\/b> ou <b>extraño<\/b>."}, {"t": "mc", "p": "Uma colega de Lima conta na reunião de equipe: «¡Estoy embarazada!». Ela está:", "o": ["grávida", "envergonhada", "atrasada"], "c": 0, "e": "Embarazada é grávida. Envergonhada é <b>avergonzada<\/b>. Esse é um dos falsos amigos mais conhecidos."}, {"t": "mc", "p": "No e-mail: «Nuestra oficina de Monterrey abre a las ocho». A empresa tem em Monterrey:", "o": ["um escritório", "uma oficina de carros", "um depósito"], "c": 0, "e": "Oficina continua sendo escritório, também no contexto corporativo."}]}]}</script><script src="/chave/assets/chave.js?v=1"></script></body></html>
